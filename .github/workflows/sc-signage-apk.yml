name: Build SC Signage APK

on:
  push:
    branches: [master, main]
    paths: ['sc-signage/android/**', '.github/workflows/sc-signage-apk.yml']
    tags: ['signage-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: sc-signage/android
        env:
          # optional: set these in repo Settings > Secrets to use your own key
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp sc-signage/android/app/build/outputs/apk/release/app-release.apk sc-signage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sc-signage-apk
          path: sc-signage.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/signage-v')
        uses: softprops/action-gh-release@v2
        with:
          files: sc-signage.apk
