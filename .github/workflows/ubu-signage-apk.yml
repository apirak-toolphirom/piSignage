name: Build UBU Signage APK

on:
  push:
    branches: [master, main]
    paths: ['ubu-signage/android/**', '.github/workflows/ubu-signage-apk.yml']
    tags: ['signage-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ubu-signage/android
        env:
          # optional: set these in repo Settings > Secrets to use your own key
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp ubu-signage/android/app/build/outputs/apk/release/app-release.apk ubu-signage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ubu-signage-apk
          path: ubu-signage.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/signage-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ubu-signage.apk
