<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>UBU Signage Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none;
    font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
    -webkit-transition: opacity .6s; transition: opacity .6s; }
  .layer.show { opacity: 1; }
  .layer img, .layer video, .layer iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border: 0; background: #000; object-fit: contain; }
  .layer .cover { object-fit: cover; }
  .layer iframe { background: #fff; }
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 7vh; min-height: 40px; overflow: hidden; display: none;
    background: rgba(0,0,0,.78); border-top: 3px solid #e5761b; z-index: 5; }
  #ticker span { position: absolute; top: 0; left: 0; white-space: nowrap; line-height: 7vh; font-size: 4vh; font-weight: 600;
    will-change: transform; }
  #idle { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; z-index: 2;
    background: radial-gradient(circle at 30% 20%, #2a3346, #0b0e14); text-align: center; }
  #idle .wrap { position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  #idle .clock { font-size: 14vh; font-weight: 300; letter-spacing: .02em; }
  #idle .date { font-size: 4vh; opacity: .8; }
  #idle .name { margin-top: 4vh; font-size: 3vh; opacity: .55; }
  #info { position: absolute; left: 2vw; top: 2vh; z-index: 9; background: rgba(0,0,0,.7); padding: 1.2vh 1.6vw;
    border-radius: 1vh; font-size: 2.2vh; line-height: 1.6; display: none; }
  #net { position: absolute; right: 1vw; top: 1vh; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #dc2626;
    z-index: 9; display: none; box-shadow: 0 0 0 .4vh rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layerA"></div>
  <div class="layer" id="layerB"></div>
  <div id="idle"><div class="wrap"><div class="clock" id="idle-clock"></div><div class="date" id="idle-date"></div><div class="name" id="idle-name"></div></div></div>
  <div id="ticker"><span id="ticker-text"></span></div>
</div>
<div id="info"></div>
<div id="net" title="ออฟไลน์"></div>
<script src="player.js"></script>
</body>
</html>
